name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # net462 tests only run on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the SDK to 10.0.100. 8.0.x is here for the net8.0 test runtime.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        if: github.event_name == 'pull_request'
        run: dotnet test --no-build -c Release --logger trx

      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: dotnet test --no-build -c Release --logger trx --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack --no-build -c Release -o artifacts/packages

      - name: Upload test results
        if: failure() || github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/*/TestResults/**

      - name: Upload packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*
